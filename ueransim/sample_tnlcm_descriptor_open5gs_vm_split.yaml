title: "Sample TNLCM descriptor for UERANSIM"
description: "UERANSIM split with Open5GS in VM"
trial_network:
  tn_vxlan:
    type: "tn_vxlan"
    dependencies: []
    input: {}
  tn_bastion:
    type: "tn_bastion"
    dependencies:
      - "tn_vxlan"
    input: {}
  vnet-n2:
    type: "vnet"
    name: "n2"
    dependencies:
      - "tn_vxlan"
      - "tn_bastion"
    input:
      one_vnet_first_ip: "10.10.10.1"
      one_vnet_netmask: 24
      one_vnet_address_size: 100
      # one_vnet_gw: null    # there is no gateway in this network
      # one_vnet_dns: null   # there is no DNS in this network
  open5gs_vm-core:
    type: "open5gs_vm"
    name: "core"
    dependencies:
      - "tn_vxlan"
      - "tn_bastion"
      - "vnet-n2"
    input:
      one_open5gs_vm_external_vnet: "tn_vxlan"
      one_open5gs_vm_internal_vnet:
        - "vnet-n2"
      one_open5gs_vm_size: "small"
      one_open5gs_vm_ue_subnet: "10.45.0.0/16"
      one_open5gs_vm_amf_n2_ip: "10.10.10.200"
      one_open5gs_vm_upf_n3_ip: "10.10.10.201"
      # one_open5gs_vm_ue_count: 20        # Default value
      # one_open5gs_vm_tac: 200            # Default value
      # one_open5gs_vm_mcc: "001"          # Default value
      # one_open5gs_vm_mnc: "01"           # Default value
      # one_open5gs_vm_msin: "0000000001"  # Default value
      # one_open5gs_vm_key: "465B5CE8B199B49FAA5F0A2EE238A6BC"  # Default value
      # one_open5gs_vm_opc: "E8ED289DEBA952E4283B54E88E6183CA"  # Default value
      # one_open5gs_vm_apn: "internet"     # Default value
      # one_open5gs_vm_s_nssai_sst: 1      # Default value
      one_open5gs_vm_s_nssai_sd: "000009"
  ueransim-gnb:
    type: "ueransim"
    name: "gnb"
    dependencies:
      - "tn_vxlan"
      - "tn_bastion"
      - "vnet-n2"
      - "open5gs_vm-core"
    input:
      one_ueransim_networks:
        - "tn_vxlan"
      one_ueransim_mode: "gnb"
      # one_ueransim_run_gnb: true  # Default value in mode 'gnb'
      # one_ueransim_run_ue: false  # Default value in mode 'gnb'
      one_ueransim_gnb_linked_5gcore: "open5gs_vm-core"
      # one_ueransim_gnb_amf_n2_ip: "10.10.10.200"  # Autocompleted from open5gs_k8s-core. Default value is 10.21.12.200
      # one_ueransim_gnb_tac: 200                   # Default value + autocompleted from open5gs_k8s-core
      # one_ueransim_gnb_mcc: "001"                 # Default value + autocompleted from open5gs_k8s-core
      # one_ueransim_gnb_mnc: "01"                  # Default value + autocompleted from open5gs_k8s-core
      # one_ueransim_gnb_slices_sst: 1              # Default value + autocompleted from open5gs_k8s-core
      # one_ueransim_gnb_slices_sd: "000009"        # Autocompleted from open5gs_k8s-core. Default value is 000001
  ueransim-ue:
    type: "ueransim"
    name: "ue"
    dependencies:
      - "tn_vxlan"
      - "tn_bastion"
      - "vnet-n2"
      - "open5gs_vm-core"
      - "ueransim-gnb"
    input:
      one_ueransim_networks: 
        - "tn_vxlan"
      one_ueransim_mode: "ue"
      # one_ueransim_run_gnb: false  # Default value in mode 'ue'
      # one_ueransim_run_ue: true    # Default value in mode 'ue'
      one_ueransim_ue_linked_gnb: "ueransim-gnb"
      # one_ueransim_ue_gnbsearchlist: "localhost"               # Autocompleted from ueransim-gnb
      # one_ueransim_ue_mcc: "001"                               # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_mnc: "01"                                # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_msin: "0000000001"                       # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_key: "465B5CE8B199B49FAA5F0A2EE238A6BC"  # Default value + autocompleted from the linked_gnb's linked_5gcore
      # one_ueransim_ue_opc: "E8ED289DEBA952E4283B54E88E6183CA"  # Default value + autocompleted from the linked_gnb's linked_5gcore
      # one_ueransim_ue_session_apn: "internet"                  # Default value + autocompleted from the linked_gnb's linked_5gcore
      # one_ueransim_ue_session_sst: 1                           # Default value + autocompleted from the linked_gnb's linked_5gcore
      # one_ueransim_ue_session_sd: "000009"                     # Autocompleted from from the linked_gnb's linked_5gcore (open5gs_k8s-core). Default value is 000001
