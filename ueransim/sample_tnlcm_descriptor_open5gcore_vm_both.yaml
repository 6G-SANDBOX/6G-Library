trial_network:
  tn_init:
    type: "tn_init"
    dependencies: []
    input: {}
  vnet-n2:
    type: "vnet"
    name: "n2"
    dependencies:
      - "tn_init"
    input:
      one_vnet_first_ip: "10.10.10.1"
      one_vnet_netmask: 24
      one_vnet_address_size: 100
      # one_vnet_gw: null    # there is no gateway in this network
      # one_vnet_dns: null   # there is no DNS in this network
  open5gcore_vm-core:
    type: "open5gcore_vm"
    name: "core"
    dependencies:
      - "tn_init"
      - "vnet-n2"
      # - "vnet-n3"
    input:
      one_open5gcore_vm_size: "small"
      one_open5gcore_vm_external_vnet: "tn_vxlan"
      one_open5gcore_vm_internal_vnet:
        - "vnet-n2"  # network used for n2 and n3 (when list length=1)
        #- "vnet-n3" # optional network used for n3
      one_open5gcore_vm_ue_subnet: "10.45.0.0/16"
      one_open5gcore_vm_amf_ip: "10.10.11.200"
      one_open5gcore_vm_upf_ip: "10.10.11.201"
      # one_open5gcore_vm_mcc: "999"
      # one_open5gcore_vm_mnc: "38"
      # one_open5gcore_vm_msin: "0000000001"
      # one_open5gcore_vm_key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
      # one_open5gcore_vm_opc: "E8ED289DEBA952E4283B54E88E6183CA"
      # one_open5gcore_vm_apn: "internet"
      # one_open5gcore_vm_tac: 200
      # one_open5gcore_vm_s_nssai_sst: 1
      # one_open5gcore_vm_s_nssai_sd: "000001"
      # one_open5gcore_vm_ue_count: 20
      # one_open5gcore_vm_upf_xdp: True
  ueransim-both:
    type: "ueransim"
    name: "both"
    dependencies:
      - "open5gcore_vm-core"
      - "vnet-n2"
    input:
      one_ueransim_networks:
        - "tn_vxlan"
        - "vnet-n2"
      one_ueransim_mode: "both"
      # one_ueransim_run_gnb: true  # Default value in mode 'both'
      # one_ueransim_run_ue: true   # Default value in mode 'both'
      one_ueransim_gnb_linked_5gcore: "open5gcore_vm-core"
      # one_ueransim_gnb_amf_n2_ip: "10.10.10.200"  # Autocompleted from open5gs_k8s-core. Default value is 10.21.12.200
      # one_ueransim_gnb_tac: 200                   # Default value + autocompleted from open5gs_k8s-core
      # one_ueransim_gnb_mcc: "001"                 # Default value + autocompleted from open5gs_k8s-core
      # one_ueransim_gnb_mnc: "01"                  # Default value + autocompleted from open5gs_k8s-core
      # one_ueransim_gnb_slices_sst: 1              # Default value + autocompleted from open5gs_k8s-core
      # one_ueransim_gnb_slices_sd: "000009"        # Autocompleted from open5gs_k8s-core. Default value is 000001
      # one_ueransim_ue_linked_gnb: null            # If undefined and mode is 'both', the same component acts as the linked gNB
      # one_ueransim_ue_gnbsearchlist: "localhost"  # Default value
      # one_ueransim_ue_mcc: "001"                               # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_mnc: "01"                                # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_msin: "0000000001"                       # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_key: "465B5CE8B199B49FAA5F0A2EE238A6BC"  # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_opc: "E8ED289DEBA952E4283B54E88E6183CA"  # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_session_apn: "internet"                  # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_session_sst: 1                           # Default value + autocompleted from the linked_gnb's linked_5gcore (open5gs_k8s-core)
      # one_ueransim_ue_session_sd: "000009"                     # Autocompleted from from the linked_gnb's linked_5gcore (open5gs_k8s-core). Default value is 000001
