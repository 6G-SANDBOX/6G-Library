    #- name: Get Ubuntu codename via lsb_release
    #  command: lsb_release -cs
    #  register: ubuntu_codename
    #  changed_when: false
    #  become: true

    #- debug:
    #    msg: "ubuntu codename: {{ ubuntu_codename.stdout }}"

    # Optional: skip if repo already installed
    - name: Check if Microsoft repo is already configured
      stat:
        path: "/etc/apt/sources.list.d/microsoft-prod.list"
      register: ms_repo_list
      become: true
      
    - name: Add Microsoft repo package
      apt:
        deb: "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb"
      when: not ms_repo_list.stat.exists
      become: true
      
    - name: Update apt cache
      apt:
        update_cache: yes
      become: true
       
    - name: Install .NET SDK
      apt:
        name: dotnet-sdk-9.0
        state: present
      become: true

    
    - name: Verify .NET installation
      command: dotnet --version
      register: dotnet_version
      changed_when: false
      become: true
      
    - debug:
        msg: "Installed .NET version: {{ dotnet_version.stdout }}"

    - name: Ensure runner directory exists
      file:
        path: "{{ runner_dir }}"
        state: directory
        mode: "0755"
      become: true
      
    - name: Download OpenTAP package zip
      get_url:
        url: "{{ opentap_url }}"
        dest: "{{ zip_path }}"
        mode: "0644"
        force: yes
      become: true
       
    - name: Unzip OpenTAP into runner
      unarchive:
        src: "{{ zip_path }}"
        dest: "{{ runner_dir }}"
        remote_src: true
        keep_newer: true
      become: true
      
    - name: Remove zip after extraction
      file:
        path: "{{ zip_path }}"
        state: absent
      become: true

    
    - name: Ensure tap is executable
      file:
        path: "{{ runner_dir }}/tap"
        mode: "0755"
        state: file
      become: true
  
      
    - name: Install Runner image using tap
      command: ./tap image install "Runner:2.0.0"
      args:
        chdir: "{{ runner_dir }}"
      become: true  

    - name: Check if the registration file exists
      ansible.builtin.stat:
        path: "{{ ks8500runner_path }}/Config/runner.lic"
      register: registration_file
      become: true
   

    - name: Register runner with Keysight sandbox
      command: ./tap runner register --name {{ ks8500runner_name }} --url {{ ks8500runner_backend_url }} --token {{ ks8500runner_registration_token }}
      args:
        chdir: "{{ runner_dir }}"
      register: register_output
      when: not registration_file.stat.exists
      #become: true

    - name: Add registration_info if available
      ansible.builtin.set_fact:
        ks8500runner_registration_info: "{{ register_output }}"
      when: register_output is defined  

    - name: Add registration_info if not available
      ansible.builtin.set_fact:
        ks8500runner_registration_info: "Registration not performed (already registered)"
      when: register_output is undefined
   
    - name: Install and start runner service
      command: ./tap runner service install --start-now
      args:
        chdir: "{{ runner_dir }}"
      #become: true
   

