    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: yes
   
    - name: Wait for APT lock to be released
      become: true
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "APT lock detected, waiting..."
          sleep 30
        done
      changed_when: false
     
    - name: Install Python 3 and related packages
      become: true
      ansible.builtin.package:
        name:
          - python3-pip
          - python3-requests
          #- docker-ce
          #- docker-ce-cli
          #- containerd.io
          #- docker-buildx-plugin
          #- docker-compose-plugin
        state: present

    # Detect if required network connectivity is available for the runner
    # Curl returns error if we cannot connect, should cause ansible script to terminate
    - name: Verify connectivity
      ansible.builtin.shell: curl https://6g-sandbox.automation.keysight.com/index.html

    # - name: Get os info
    #   command: cat /etc/os-release
    #   register: os_info

    # - name: List os info
    #   debug:
