# Substitutes doc/create_component.yaml file
# Use your Runner registration token (NOT user token) from KS8500
input:
  ks8500runner_name: "6gsb-v2runner"
  ks8500runner_registration_token: "<your registration token>"
  ks8500runner_backend_url: "https://6g-research-ext.automation.keysight.com"
  ks8500runner_post_action: "none" # "install_keysight_iolibrary" if you want to install Keysight IOLibrary which is required to support SCPI-instruments
  ks8500runner_package_download_token: "<your package download token>" # only if you want to install Keysight IOLibrary (see above)
