######################################################
##
## Component public variables
##
## Diverse information read by the TNLCM
## to adapt its behaviour depending on the component.
##
######################################################

############################################################################################################
## Component metadata
############################################################################################################
metadata:
  maintainers:
    - Vasilis Pitsilis <vpitsilis@dat.demokritos.gr>
    - George Pappas <g.pappas@oteresearch.gr>
    - Jason Diakoumakos <i.diakoumakos@oteresearch.gr>
  short_description: Enables the capability of using physical RAN in a Trial Network (Athens RAN Ericsson).
  long_description: |
    This component enables the integration of Ericsson physical equipment located at Athens with an open5Gs 5G core deployed as part of the Trial Network.
    open5Gs is a commercial 5G core deployed by COSMOTE and its internal components are not exposed to the experimenter. This component will only
    configure the routing path between the Trial Network and the Ericsson RAN.
    It is done by enabling the necessary routing path through the use of the element called 'Route Manager' (already deployed in the site). 
    The configuration exposed by this component should be synchronized with the 5G core and the UE to be used in conjunction:
    - `mcc`: "001"
    - `mnc`: "01"
    - `apn`: "internet"
    - `tac`: 200
    - `s_nssai_sst`: 1
    - `s_nssai_sd`: "000001"
    - `amf_ip`: "10.10.10.200"
    - `upf_ip`: "10.10.10.201"
    NOTE: Currently this component is only available in the site "athens".
  hypervisors: ["one"]
  destroy_script: true
  resource_manager: true
  depends_on:
    - ["open5gs_vm"]
  tags:
    - RAN
    - Ericsson
    - Athens

############################################################################################################
## Site-specific variables
############################################################################################################
site_variables:
  cp_ip: 172.25.11.200 #"Ericsson Control Plane IP address for N2 interface"
  up_ip: 172.25.13.200 #"Ericsson User Plane IP address for N3 interface"

############################################################################################################
## Input variables
############################################################################################################
input:
  one_ericsson_radio_open5gs:
    description: |
      Name of a previously deployed Open5GS 5G Core.
      This component will establish the routing path between the Open5GS core and the Ericsson RAN.
    type: "open5gs_vm or open5gs_k8s"
    required_when: true

  any_ericsson_radio_start_time:
    description: |
      Time and date from which the route is enabled, with RFC 3339 section 5.6 format. 
      Example: '2025-05-07T09:12:00+00:00'
      If unspecified, value takes current time and date.
    type: str
    default_value: Current time and date
    required_when: false

  any_athens_ran_duration:
    description: |
      Time in seconds for the Ericsson RAN reservation.
      This determines how long the routing paths will remain active.
    type: int
    default_value: 3600
    required_when: false

############################################################################################################
## Generated terraform outputs
############################################################################################################
terraform_outputs:
  __entity_name__open5gs: input.one_ericsson_radio_open5gs
