- Vasilis Pitsilis <vpitsilis@dat.demokritos.gr>
- George Pappas <g.pappas@oteresearch.gr>
- Jason Diakoumakos <i.diakoumakos@oteresearch.gr>

## Short Description

Enables the capability of using physical RAN in a Trial Network (Athens RAN Ericsson).

## Long Description

This component enables the integration of Ericsson physical equipment located at Athens with an open5Gs 5G core deployed as part of the Trial Network. open5Gs is a commercial 5G core deployed by COSMOTE and its internal components are not exposed to the experimenter. This component will only configure the routing path between the Trial Network and the Ericsson RAN.

It is done by enabling the necessary routing path through the use of the element called 'Route Manager' (already deployed in the site). The configuration exposed by this component should be synchronized with the 5G core and the UE to be used in conjunction:

- `mcc`: "001"
- `mnc`: "01"
- `apn`: "internet"
- `tac`: 200
- `s_nssai_sst`: 1
- `s_nssai_sd`: "000001"
- `amf_ip`: "10.10.10.200"
- `upf_ip`: "10.10.10.201"

## Hypervisors

- OpenNebula (one)

