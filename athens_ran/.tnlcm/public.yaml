######################################################
##
## Component public variables
##
## Diverse information read by the TNLCM
## to adapt its behaviour depending on the component.
##
######################################################


####################################
## Component metadata
####################################
metadata:
  maintainers:
    - Jason Diakoumakos <i.diakoumakos@oteresearch.gr>
    - Vasilis Pitsilis <vpitsilis@dat.demokritos.gr>
    - George Pappas <g.pappas@oteresearch.gr>
  short_description: Enables routing temporarily between Ericsson RAN and a previously deployed 5G Core regarding the Athens site.
  long_description: |
    Component to integrate the Ericsson RAN physical equipment with a 5G core already deployed inside the Trial Network.
    It is done by enabling the necessary routing path for a limited time duration using a [6G-Sandbox route-manager-api](https://marketplace.mobilesandbox.cloud:9443/appliance/service_routemanager) VM expected to be already deployed in the site.
    WARNING: This component may only work if the configurations for the related 5G Core and UE are set as follows:
    - `mcc`: "001" 
    - `mnc`: "01"
    - `apn`: "default"
    - `tac`: 1
    - `s_nssai_sst`: 1
    - `s_nssai_sd`: "000001"
    - `amf_n2_ip`: "10.10.10.200"
    - `upf_n3_ip`: "10.10.10.201"
    NOTE: Aditional routing configuration that is not dependent on the Trial Network may also need to be done beforehand.
    NOTE: Currently this component is only available in the site "athens".
  hypervisors: ["any"]
  depends_on:
    - [open5gs_vm]
  tags:
    - "gNB"
    - "route_manager"
    - "resource_manager"
    - "networking"
    - "radio"
    - "ericsson"
    - "5g_core"
    - "physical_equipment"
  destroy_script: true
  resource_manager: true


####################################
## Site-specific variables
####################################
site_variables:
  n2_ip: 172.25.11.200 #"IP address of Ericsson RAN in the Control Plane N2 interface for Athens site. It will try to connect to the AMF of the 5G Core specified in `any_athens_ran_linked_5gcore`."
  n3_ip: 172.25.13.200 #"IP address of Ericsson RAN in the User Plane N3 interface for Athens site. It will try to connect to the UPF of the 5G Core specified in `any_athens_ran_linked_5gcore`."


####################################
## Input variables
####################################
input:
  any_athens_ran_linked_5gcore:
    description: Name of a previously deployed 5G Core component inside the same Trial Network. The gNB will try to connect to its AMF.
    type: "open5gs_vm"
    required_when: true
  any_athens_ran_start_time:
    description: |
      Time and date from which the route is enabled, with RFC 3339 section 5.6 format. E.g. '2024-11-08T09:12:00+00:00'.
      If unspecified, value takes current time and date.
    type: str
    default_value: Current time and date
    required_when: false
  any_athens_ran_duration:
    description: Time in seconds for the Ericsson RAN reservation
    type: int
    default_value: 3600
    required_when: false


####################################
## Generated terraform outputs
####################################
terraform_outputs:
  __entity_name__component_type: "athens_ran"
  __entity_name__gnb_metadata:
    linked_5gcore: input.any_athens_ran_linked_5gcore
