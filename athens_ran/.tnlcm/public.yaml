## Site-specific variables

Variables read from your site's encrypted file in the 6G-Sandbox-Sites repository.
TNLCM checks that the variables are defined, and errors if attempting to deploy the component without them.
Each variable has a short description of what it does for informational purposes:

- `cp_ip`: Ericsson Control Plane IP address for N2 interface (172.25.11.200)
- `up_ip`: Ericsson User Plane IP address for N3 interface (172.25.13.200)

## Input variables

Describes the variables shown in the TNLCM to be filled by the experimenter and included in a TN descriptor.
Each variable can contain the following fields:

- `one_ericsson_radio_open5gs`:
  - description: Name of a previously deployed Open5GS 5G Core. This component will establish the routing path between the Open5GS core and the Ericsson RAN.
  - type: "open5gs_vm"
  - required_when: true

- `any_ericsson_radio_start_time`:
  - description: Time and date from which the route is enabled, with RFC 3339 section 5.6 format. Example: '2025-05-07T09:12:00+00:00'. If unspecified, value takes current time and date.
  - type: str
  - default_value: Current time and date
  - required_when: false

- `any_athens_ran_duration`:
  - description: Time in seconds for the Ericsson RAN reservation. This determines how long the routing paths will remain Aactive.
  - type: int
  - default_value: 3600
  - required_when: false

## Generated terraform outputs

Unknown before the deployment, they are stored in the S3 Object Storage, and available to use by future components.


- `__entity_name__open5gs`: Reference to the deployed Open5GS core component

> [!NOTE]  
> Currently this component is only available in the site "athens".
