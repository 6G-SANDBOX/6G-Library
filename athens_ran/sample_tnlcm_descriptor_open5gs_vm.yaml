trial_network:
  tn_init:
    type: "tn_init"
    dependencies: []
    input: 
      one_vxlan_mtu: 1450
      one_vxlan_guest_mtu: 1400
      one_bastion_vpn_clients: 3
  vnet-n2:
    type: "vnet"
    name: "n2"
    dependencies:
      - "tn_init"
    input:
      one_vnet_first_ip: "10.10.10.1"
      one_vnet_netmask: 24
      one_vnet_address_size: 254
      one_vnet_mtu: 1450
      one_vnet_guest_mtu: 1400
  open5gs_vm-core:
    type: "open5gs_vm"
    name: "core"
    dependencies:
      - "tn_init"
      - "vnet-n2"
    input:
      one_open5gs_vm_external_vnet: "tn_vxlan"
      one_open5gs_vm_internal_vnet:
        - "vnet-n2"
      one_open5gs_vm_size: "small"
      one_open5gs_vm_ue_subnet: "10.45.0.0/16"
      one_open5gs_vm_amf_n2_ip: "10.10.10.200"
      one_open5gs_vm_upf_n3_ip: "10.10.10.201"
      one_open5gs_vm_ue_count: 20           # Default value is 20
      one_open5gs_vm_tac: 1                # Default value is 200
      one_open5gs_vm_mcc: "001"            # Default value is "001"
      one_open5gs_vm_mnc: "01"            # Default value is "01"
      one_open5gs_vm_msin: "0000000001"    # Default value is "0000000001"
      one_open5gs_vm_key: "465B5CE8B199B49FAA5F0A2EE238A6BC"  # Default value
      one_open5gs_vm_opc: "E8ED289DEBA952E4283B54E88E6183CA"  # Default value
      one_open5gs_vm_apn: "default"     # Default value is internet
      one_open5gs_vm_s_nssai_sst: 1      # Default value
      one_open5gs_vm_s_nssai_sd: "000001"  # Default value is "000001"
  
  athens_ran-RAN:
    type: "athens_ran"
    name: "RAN"
    dependencies:
      - "open5gs_vm-core"
    input:
      any_athens_ran_linked_5gcore: "open5gs_vm-core"
      any_athens_ran_duration: 3600                # Default is 3600 seconds
