##
######################################################


####################################
## Component metadata
####################################
metadata:
  maintainers:
    - Jesus Macias Portela <jesus.maciasportela@telefonica.com>
    - Ana Isabel Lara García <anaisabel.laragarcia@telefonica.com>
    - Álvaro Curto Merino <alvaro.curtomerino@telefonica.com>
    - Bjoern Riemer <bjoern.riemer@fokus.fraunhofer.de>
  short_description: Attach an existing physical gNB with a previously deployed 5G Core component for a limited period of time.
  long_description: |
    This component allows the experimenter to temporarily integrate physical RAN equipment with a 5G core component inside the Trial Network.
    In order to handle the reservation of limited resources for multiple users, connections are limited to a single time slot of 
    TODO
    

    Component to integrate the Nokia Airscale physical equipment with a 5G core already deployed inside the Trial Network.
    It is done by enabling the necessary routing path for a limited time duration using a [6G-Sandbox route-manager-api](https://marketplace.mobilesandbox.cloud:9443/appliance/service_routemanager) VM expected to be already deployed in the site.
    WARNING: This component may only work if the configurations for the related 5G Core and UE are correctly configured beforehand?

    NOTE: Aditional routing configuration that is not dependent on the Trial Network may also need to be done beforehand.
    NOTE: Currently this component is only available in the site "uma".
  hypervisors: ["any"]
  destroy_script: true
  resource_manager: true


####################################
## Site-specific variables
####################################

# List of IP addresses or subnetworks that will be routed from the Trial Network through the 
# These IPs can include things such as the Control/User Plane IPs of the gNB
site_variables: []     

####################################
## Input variables
####################################
input:
  any_hw_gNB_linked_5gcore:
    description: Name of a valid 5G Core component inside the same Trial Network. The gNB will attach to its AMF.
    type: "open5gs_k8s or open5gs_vm or open5gcore_vm or upf_p4_sw"
    required_when: true
  any_hw_gNB_cp:
  # any_hw_gNB_start_time:
  #   description: |
  #     Time and date from which the route is enabled, with RFC 3339 section 5.6 format. E.g. '2024-11-08T09:12:00+00:00'.
  #     If undefined, the reservation start time will take the current time and date.
  #   type: str
  #   default_value: "Current time and date"
  #   required_when: false
  # any_hw_gNB_duration:
  #   description: Time in seconds for the gNB reservation starting from `any_hw_gNB_start_time`. 3 hours by default.
  #   type: int
  #   default_value: 10800
  #   required_when: false


####################################
## Generated terraform outputs
####################################
terraform_outputs:
  __entity_name__linked_5gcore: input.any_hw_gNB_linked_5gcore
