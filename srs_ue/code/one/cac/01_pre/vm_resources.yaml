---
- name: "Set variables for the terraform manifest according to the selected appliance"
  ansible.builtin.set_fact:
    one_memory: >
      {{
          one_srs_ue_memory
       }}
    template_id: >-
      {{
      
          site_available_components.srs_ue.template_id | default(site_available_components.srs_ue.template_id)
       }}
    image_id: >-
      {{ 
          site_available_components.srs_ue.image_id | default(site_available_components.srs_ue.image_id)
       }}


- name: Overwrite again with explicit values from the input file
  ansible.builtin.include_vars:
    file: "{{ workspace }}/{{ component_type }}/variables/input_file.yaml"
