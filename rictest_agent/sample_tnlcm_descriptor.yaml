trial_network:

  tn_init:
    type: "tn_init"
    dependencies: []
    input:
      one_vxlan_first_ip: "192.168.111.1"
      one_vxlan_address_size: 254
      one_bastion_vpn_clients: 10
      one_bastion_routemanager_add:
        - to: "10.111.1.0/24"
          dev: "wg0"

  vnet-n2:
    type: "vnet"
    name: "n2"
    dependencies:
      - "tn_init"
    input:
      one_vnet_first_ip: "10.111.1.1"
      one_vnet_netmask: 24
      one_vnet_address_size: 254

  rictest_agent-a1:
    type: "rictest_agent"
    name: "a1"
    dependencies:
      - "vnet-n2"
    input:
      one_rictest_agent_networks:
        - "tn_vxlan"
        - "vnet-n2"
        - "vnet-n2"