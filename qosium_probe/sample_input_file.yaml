trial_network:
  tn_init:
    type: "tn_init"
    dependencies: []
    input: {}
  qosium_probe-agent:
    type: "qosium_probe"
    name: "agent"
    dependencies:
      - "tn_init"
    input:
      one_vm_kvm_size: "small"
      one_vm_kvm_networks:
        - "tn_vxlan"
      qosium_probe_service_id: 10
      ntp_server_address: "pool.ntp.org"

