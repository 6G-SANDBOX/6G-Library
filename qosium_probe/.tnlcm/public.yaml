######################################################
##
## Component public variables
##
######################################################


############################################################################################################
## Component metadata
############################################################################################################
metadata:
  maintainers:
    - Esa Piri <esa.piri@kaitotek.com>
    - Jarmo Prokkola <jarmo.prokkola@kaitotek.com>
    - Saad Hassan <Saad.Hassan@oulu.fi>

  short_description: Qosium Probe measurement agent for passive QoS/QoE measurement.
  long_description: |
    Kaitotek's Qosium is a passive QoS/QoE measurement solution. The solution consists of multiple software components,
    each with a dedicated role in measurement. The main entity is Qosium Probe, a measurement agent, which conducts the measurement.
    Qosium Probes do nothin alone but needs a controller software (Qosium Scope, Qosium Scopemon, or your own).
    Read more at www.kaitotek.com/resources/documentation
  hypervisors: [one]

############################################################################################################
## Site-specific variables
############################################################################################################
site_variables:
  template_id: Short description of what this variable represents.


############################################################################################################
## Input variables
############################################################################################################
input:
  one_qosium_probe_vm_networks:
    description: Ordered list of Virtual Network names the VM will be part of. The first Virtual Network is used by Jenkins to reach and configure the VM, so most cases will be fine using always the tn_vxlan
    type: "list[tn_vxlan or vnet]"
    default_value: ["tn_vxlan"]
    required_when: false
  one_qosium_probe_vm_size:
    description: |
      Select one type of instance according to your hardware requirements.
      - extra_large: 32 GiB of memory, 8 vCPU and 100GiB of storage
      - large: 16 GiB of memory, 4 vCPU and 50GiB of storage
      - medium: 8 GiB of memory, 4 vCPU and 25GiB of storage
      - small: 4 GiB of memory, 2 vCPU and 15GiB of storage
      - very_small: 2 GiB of memory, 1 vCPU and 10GiB of storage
    type: str
    default_value: "small"
    choices:
      - "extra_large"
      - "large"
      - "medium"
      - "small"
      - "very_small"
    required_when: false
  one_qosium_probe_service_id:
    description: A unique identifier number for the Qosium Probe
    type: int
    default_value: 10
    required_when: false
  one_qosium_probe_ntp_server_address:
    description: |
      A local NTP server address. If not set, uses the default pool.ntp.org
    type: str
    default_value: "pool.ntp.org"
    required_when: false

############################################################################################################
## Generated terraform outputs
############################################################################################################
terraform_outputs:
  __entity_name__id: "Variable tied to a specific deployment of this component."
  tn_ssh_public_key: "Variable with a global name. Generated by a component that can only be deployed once per TN, such as tn_init"
