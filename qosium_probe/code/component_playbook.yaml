---
# Main playbook to deploy the component
- name: "STAGE 1: Apply IAC to deploy the component"
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: Load enviromental variables from different sources
      ansible.builtin.include_tasks: "{{ workspace }}/.global/cac/load_variables.yaml"


    - name: Prepare terraform working directory
      ansible.builtin.include_tasks: "{{ workspace }}/.global/cac/terraform_workdir.yaml"


    - name: Configure selected VM resources
      ansible.builtin.include_tasks: "{{ workspace }}/{{ component_type }}/code/{{ site_hypervisor }}/cac/01_pre/vm_resources.yaml"

    - name: Terraform apply
      ansible.builtin.include_tasks: "{{ workspace }}/.global/cac/terraform_apply.yaml"


# Post-terraform preliminary tasks
- name: "STAGE 2: Prepare to access the component"
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:

    - name: Retrieve terraform outputs
      ansible.builtin.shell:
      args:
        chdir: "{{ workspace }}/.terraform/"
        cmd: "set -o pipefail && terraform output --json | jq 'with_entries(.value |= .value)'"
        executable: /bin/bash
      register: terraform_outputs
      changed_when: false

    - name: Set Terraform outputs as playbook facts
      ansible.builtin.set_fact:
        # defined in the tn_init deployment
        bastion_ip: "{{ (terraform_outputs.stdout | from_json)['tn_bastion-ips'][site_networks_id.default | string] }}"
        # defined in the tn_init deployment
        tn_ssh_public_key: "{{ (terraform_outputs.stdout | from_json)['tn_ssh_public_key'] }}"
        # IPs of the newly created VM
        ips: "{{ (terraform_outputs.stdout | from_json)[entity_name + '-ips'] }}"
        # ID of the newly created VM
        id: "{{ (terraform_outputs.stdout | from_json)[entity_name + '-id'] }}"
        # ID of the first VNet used in this VM
        access_vnet_id: "{{ (terraform_outputs.stdout | from_json)[one_qosium_probe_vm_networks[0] + '-id'] | string }}"

    - name: Add new VM to Ansible Inventory
      ansible.builtin.add_host:
        hostname: "qosium_probe"
        ansible_host: "{{ ips[access_vnet_id] }}"
        ansible_ssh_common_args: "-J jenkins@{{ bastion_ip }}"
        ansible_user: "jenkins"

    - name: Add new VM to SSH config file in the Jenkins-master for debugging purposes
      ansible.builtin.include_tasks: "{{ workspace }}/.global/cac/jenkins_ssh_config.yaml"

    - name: Add new VM to an SSH config file ment to be usable by the experimenter
      ansible.builtin.include_tasks: "{{ workspace }}/.global/cac/tnuser_ssh_config.yaml"


# Configuration play
- name: "STAGE 3: Apply CAC to prepare the component"
  hosts: "qosium_probe"
  gather_facts: false
  tasks:
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        timeout: 200

    - name: Load enviromental variables from different sources
      ansible.builtin.include_tasks: "{{ workspace }}/.global/cac/load_variables.yaml"


    - name: Set site ssh key as authorized in jenkins user
      ansible.posix.authorized_key:
        user: jenkins
        state: present
        key: "{{ item }}"
      loop:
        - "{{ hostvars['localhost'].get('site_admin_ssh_public_key', '') }}"
      when: item != ''

    - name: Create new user for experimenter access
      become: true
      ansible.builtin.user:
        name: tnuser
        shell: /bin/bash
        groups: sudo
        password: ''
    - name: Set TN ssh key as authorized in new user
      become: true
      ansible.posix.authorized_key:
        user: tnuser
        state: present
        key: "{{ item }}"
      loop:
        - "{{ hostvars['localhost']['tn_ssh_public_key'] }}"

- name: "Update Qosium Probe Service ID and restart Probe if changed"
  hosts: "all"
  become: true

  tasks:
#    - name: Update Qosium Probe Service ID
#      ansible.builtin.lineinfile:
#        path: /opt/QosiumProbe/bin/QosiumProbe.ini
#        regexp: '^service_id\s+'
#        line: "service_id {{ one_qosium_probe_service_id }}"
#        backup: no
#      when: one_qosium_probe_service_id is defined
#      notify: "Restart Qosium Probe"

#      handlers:
#        - name: Restart Qosium Probe
#          ansible.builtin.systemd:
#            name: QosiumProbe
#            state: restarted

    - name: Configure NTP server in chrony.conf
      become: true
      lineinfile:
        path: /etc/chrony/chrony.conf
        regexp: '^(pool|server)\s+.*'
        line: "server {{ one_qosium_probe_ntp_server_address }} minpoll 1 maxpoll 3 burst iburst"
        state: present
      when: one_qosium_probe_ntp_server_address is defined and one_qosium_probe_ntp_server_address != "pool.ntp.org"

    - name: Restart chronyd service
      become: yes
      service:
        name: chrony
        state: restarted
      when: one_qosium_probe_ntp_server_address is defined and one_qosium_probe_ntp_server_address != "pool.ntp.org"


# Final phase of the deployments
- name: "STAGE 4: Publish execution results"
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Publish execution results to TNLCM and S3 object storage
      ansible.builtin.include_tasks: "{{ workspace }}/.global/cac/publish_ok_results.yaml"
