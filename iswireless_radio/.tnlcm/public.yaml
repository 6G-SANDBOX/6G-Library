######################################################
##
## Component public variables
##
## Diverse information read by the TNLCM
## to adapt its behaviour depending on the component.
##
######################################################


####################################
## Component metadata
####################################
metadata:
  maintainers:
    - Jesus Macias Portela <jesus.maciasportela@telefonica.com>
    - Ana Isabel Lara García <anaisabel.laragarcia@telefonica.com>
    - Álvaro Curto Merino <alvaro.curtomerino@telefonica.com>
  short_description: Enables the capability of using ISWIRELESS Radio in a Trial Network.
  long_description: |
    TODO: Say more about how this component has virtualized RAN components blah blah.
    This component enables the integration of ISWIRELESS physical equipment located at UMA with a 5G core deployed in the Trial Network.
    It is done by enabling the necessary routing path through the use of the element called ‘Route Manager’ (already deployed in the site). 
    The configuration exposed by this component should be synchronized with the 5G core and the UE to be used in conjunction:
    - `mcc`: "999" 
    - `mnc`: "71"
    - `apn`: "internet"
    - `tac`: 1
    - `s_nssai_sst`: 1
    - `s_nssai_sd`: "000009"
    - `amf_n2_ip`: "10.10.12.200"
    - `upf_n3_ip`: "10.10.12.201"
    NOTE: Currently this component is only available in the site "uma".
  hypervisors: ["any"]
  depends_on:
    - "tn_bastion"
    - "[open5gs_vm, open5gs_k8s,  open5gcore_vm, upf_p4_sw] if any_iswireless_radio_ru_du == false"
    - "cu_k8s if any_iswireless_radio_ru_du == true"
  tags:
    - "route_manager"
    - "resource_manager"
    - "gNB"
  destroy_script: true
  resource_manager: true


####################################
## Site-specific variables
####################################
site_variables:
  cu_ip: IP address of the CU when not running in RU-DU mode.
  du_ip: IP address of the DU when running in RU-DU mode.
  portainer_url: "URL of the Portainer instance managing the CU & DU containers. E.g. 'http://10.20.30.40:9000'"
  portainer_token: "Valid API token for authentication as a user with administrative rights."
  portainer_environment: "Portainer environment ID where the CU & DU containers are. E.g. '1'"
  cu_container_name: "Name of the CU container in Portainer. E.g. 'cu'"
  du_cu_container_name: "Name of the DU container for non RU-DU mode in Portainer. E.g. 'du'"
  du_container_name: "Name of the DU container for RU-DU mode in Portainer. E.g. 'ru-du'"
  # The name of the container_name variables is debatable.

####################################
## Input variables
####################################
input:
  any_iswireless_radio_ru_du:
    description: Set the IS-WIRELESS gNB into RU-DU mode, requiring a separate virtualized CU component.
    type: bool
    default_value: false
    required_when: false
  any_iswireless_radio_linked_5gcore:
    description: |
      Name of a previously deployed 5G Core component inside the same Trial Network. The gNB will try to connect to its AMF.
      Ignored in *RU-DU* mode, required otherwise.
    type: "open5gs_vm or open5gs_k8s or open5gcore_vm or upf_p4_sw"
    required_when: any_iswireless_radio_ru_du == false
  any_iswireless_radio_linked_cu:
    description: |
      Name of a previously deployed `cu_k8s` component inside the same Trial Network.
      Required in *RU-DU* mode, ignore otherwise.
    type: cu_k8s
    required_when: any_iswireless_radio_ru_du == true
  any_iswireless_radio_start_time:
    description: |
      Time and date from which the route is enabled, with RFC 3339 section 5.6 format. E.g. '2024-11-08T09:12:00+00:00'.
      If unspecified, value takes current time and date.
    type: str
    default_value: Current time and date
    required_when: false
  any_iswireless_radio_duration:
    description: Time in seconds for the ISWIRELESS reservation. 3 hours by default
    type: int
    default_value: 10800
    required_when: false


####################################
## Generated terraform outputs
####################################
terraform_outputs:
  __entity_name__component_type: "iswireless_radio"
  __entity_name__gnb_metadata:
    linked_5gcore: input.any_iswireless_radio_linked_5gcore
