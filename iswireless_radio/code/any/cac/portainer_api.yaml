---
- name: GET container
  ansible.builtin.uri:
    url: >-
      {{
        site_available_components.iswireless_radio.portainer_url
        ~ '/api/endpoints/'
        ~ site_available_components.iswireless_radio.portainer_environment
        ~ '/docker/containers/json?filters='
        ~ ({'name': [item]} | to_json | urlencode)
      }}
    method: GET
    status_code: [200]
    headers:
      X-API-Key: "{{ site_available_components.iswireless_radio.portainer_token }}"
  register: container

- name: Get container ID
  ansible.builtin.set_fact:
    container_id: "{{ (container.json | default([]) | first).Id | default(None) }}"

- name: Destroy container if it exists
    - name: STOP a container
      ansible.builtin.uri:
        url: >-
          {{
            site_available_components.iswireless_radio.portainer_url ~ '/api/endpoints/' ~ site_available_components.iswireless_radio.portainer_environment ~ '/docker/containers/' ~ item ~ '/stop'
          }}
        method: POST
        status_code: [204]
      headers:
        X-API-Key: "{{ site_available_components.iswireless_radio.portainer_token }}"

    - name: REMOVE a container
      ansible.builtin.uri:
        url: >-
          {{
            site_available_components.iswireless_radio.portainer_url ~ '/api/endpoints/' ~ site_available_components.iswireless_radio.portainer_environment ~ '/docker/containers/' ~ item
          }}
        method: DELETE
        status_code: [204]
      headers:
        X-API-Key: "{{ site_available_components.iswireless_radio.portainer_token }}"


- name: CREATE a container
  ansible.builtin.uri:
    url: >-
      {{
        site_available_components.iswireless_radio.portainer_url ~ '/api/endpoints/1/docker/containers/create'
      }}
    method: POST
    headers:
      Authorization: "Bearer {{ portainer_token }}"
    body_format: json
    body:
      # Image: "{{ item }}"
      # HostConfig:
      #   RestartPolicy:
      #     Name: always
      #   PortBindings:
      #     "8080/tcp":
      #       - HostPort: "8080"
      # NetworkingConfig:
      #   EndpointsConfig:
      #     portainer_network:
      #       IPAMConfig:
      #         IPv4Address:
    status_code: [201]
  register: created_container

