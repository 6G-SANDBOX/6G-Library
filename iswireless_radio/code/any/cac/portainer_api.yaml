- name: START a container
  ansible.builtin.uri:
    url: >-
      {{
        site_available_components.iswireless_radio.portainer_url ~ '/api/endpoints/1/docker/containers/' ~ created_container ~ '/start'
      }}
    method: POST
    status_code: [204]

