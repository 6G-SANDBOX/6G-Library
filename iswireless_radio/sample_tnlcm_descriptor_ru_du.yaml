trial_network:
  tn_init:
    type: "tn_init"
    dependencies: []
    input: {}
  vnet-internal:
    type: "vnet"
    name: "internal"
    dependencies:
      - "tn_init"
    input:
      one_vnet_first_ip: "10.10.12.1"
      one_vnet_netmask: 24
      one_vnet_address_size: 100
      one_vnet_gw: "10.10.12.1"
  oneKE-cluster:
    type: "oneKE"
    name: "cluster"
    dependencies:
      - "vnet-internal"
    input:
      one_oneKE_external_vnet: "tn_vxlan"
      one_oneKE_internal_vnet: "vnet-internal"
      # one_oneKE_cni_plugin: "canal"  # Default value
      # one_oneKE_metallb: true        # Default value
      one_oneKE_metallb_range: "10.10.12.200-10.10.12.240"
  open5gs_k8s-core:
    type: "open5gs_k8s"
    name: "core"
    dependencies:
      - "oneKE-cluster"
    input:
      one_open5gs_k8s_target: "oneKE-cluster"
      one_open5gs_k8s_amf_n2_ip: "10.10.12.200"
      one_open5gs_k8s_upf_n3_ip: "10.10.12.201"
      one_open5gs_k8s_ue_count: 1
      one_open5gs_k8s_tac: 1
      one_open5gs_k8s_mcc: "001"
      one_open5gs_k8s_mnc: "01"
      # one_open5gs_vm_msin: "0000000001"
      # one_open5gs_vm_key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
      # one_open5gs_vm_opc: "E8ED289DEBA952E4283B54E88E6183CA"
      one_open5gs_k8s_apn: "internet"
      one_open5gs_k8s_s_nssai_sst: 1
      one_open5gs_k8s_s_nssai_sd: "000009"
  ric_k8s-demo:
    type: "ric_k8s"
    name: "demo"
    dependencies:
    - "open5gs_k8s-core"
    input:
      one_ric_k8s_target: "oneKE-cluster"
      one_ric_k8s_ip: "10.10.12.202"
      one_ric_k8s_quota1: "20"
      one_ric_k8s_quota2: "80"
      one_ric_k8s_slice_id1: "1"
      one_ric_k8s_slice_id2: "2"
      one_ric_k8s_flip_period: "5"
      dockerhub_token: "XXX"
  cu_k8s-demo:
    type: "cu_k8s"
    name: "demo"
    dependencies:
      - "ric_k8s-demo"
    input:
      one_cu_k8s_target: "oneKE-cluster"
      one_cu_open5gs_target: "open5gs_k8s-core"
      one_cu_k8s_n3_ip: "10.10.12.203"
      one_cu_k8s_n2_ip: "10.10.12.202"
      one_cu_open5gs_amf_ip: "open5gsk8s-core-amf-ngap.open5gsk8s-core.svc.cluster.local"
      one_cu_open5gs_upf_ip: "open5gsk8s-core-upf-gtpu.open5gsk8s-core.svc.cluster.local"
      one_cu_ric_ip: "e2-service.rick8s-demo.svc.cluster.local"
      dockerhub_token: "XXX"
  iswireless_radio-RAN:
    type: "iswireless_radio"
    name: "RAN"
    dependencies:
      - "open5gs_k8s-core"
    input:
      any_iswireless_radio_ru_du: true                              # Default value is false
      any_iswireless_radio_linked_cu: "cu_k8s-demo"
      any_iswireless_radio_start_time: "2025-05-30T09:12:00+00:00"  # Default value takes current time and date
      any_iswireless_radio_duration: 7200                           # Default value is 10800, 3 hours
