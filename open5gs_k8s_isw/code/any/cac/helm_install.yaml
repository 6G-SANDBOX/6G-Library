---
- name: Render helm values template
  ansible.builtin.template:
    src: "{{ workspace }}/{{ component_type }}/code/any/cac/helm_values_template-open5gs.yaml.j2"
    dest: "/root/{{ helm_release_name }}-values-open5gs.yaml"

- name: Authenticate in DockerHub and create secret
  ansible.builtin.shell: |
    helm registry login registry-1.docker.io -u smecina -p {{ dockerhub_token }}
    kubectl create ns {{ helm_release_name }} --dry-run=client -o yaml | kubectl apply -f -
    kubectl create secret docker-registry regcred --docker-username=smecina --docker-password={{ dockerhub_token }} -n {{ helm_release_name }} --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml

- name: Deploy Open5gs helm
  kubernetes.core.helm:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    name: "{{ helm_release_name }}"
    chart_ref: oci://registry-1.docker.io/iswirelesspoland/open5gs-charts
    chart_version: 0.1.0
    namespace: "{{ helm_release_name }}"
    values_files:
    - "/root/{{ helm_release_name }}-values-open5gs.yaml"

- name: Wait until all pods are Running
  ansible.builtin.command: "kubectl wait pod --all --for=condition=Ready -n {{ helm_release_name }} --timeout=240s"
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml