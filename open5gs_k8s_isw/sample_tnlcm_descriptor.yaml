trial_network:
  tn_init:
    type: "tn_init"
    dependencies: []
    input: {}
  vnet-internal:
    type: "vnet"
    name: "internal"
    dependencies:
      - "tn_init"
    input: {}
  oneKE-cluster:
    type: "oneKE"
    name: "cluster"
    dependencies:
      - "vnet-internal"
    input:
      one_oneKE_external_vnet: "tn_vxlan"
      one_oneKE_internal_vnet: "vnet-internal"
      one_oneKE_cni_plugin: "calico"
      one_oneKE_multus: true
      one_oneKE_metallb_range: "10.21.12.200-10.21.12.240"
  open5gs_k8s_isw-demo:
    type: "open5gs_k8s_isw"
    name: "demo"
    dependencies:
      - "oneKE-cluster"
    input:
      one_cu_k8s_target: "oneKE-cluster"
      dockerhub_token: "XXX"
