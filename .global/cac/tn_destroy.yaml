---
- name: "STAGE 1: Apply IAC to deploy the component"
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Load site-specific variables
      ansible.builtin.include_vars:
        file: "{{ workspace }}/6G-Sandbox-Sites/{{ deployment_site }}/core.yaml"

    - name: Create directory for terraform manifests
      ansible.builtin.file:
        path: "{{ workspace }}/.terraform"
        state: directory
        mode: "755"

    - name: "Prepare terraform manifest for provider: {{ site_hypervisor }}"
      ansible.builtin.copy:
        src: "{{ workspace }}/.global/iac/{{ site_hypervisor }}/provider.tf"
        dest: "{{ workspace }}/.terraform/{{ site_hypervisor }}_provider.tf"
        mode: "640"

    - name: Prepare AWS s3 backend terraform manifest
      ansible.builtin.template:
        src: "{{ workspace }}/.global/iac/backend.tf.j2"
        dest: "{{ workspace }}/.terraform/backend.tf"
        mode: "640"

    - name: Run 'terraform apply' a first time. Command will fail
      community.general.terraform:
        project_path: "{{ workspace }}/.terraform/"
        state: "present"
        force_init: true
      ignore_errors: true
      register: first_apply_result

    # The OpenNebula terraform provider can hard-error on refresh/plan when an
    # opennebula_virtual_network_address_range's AR was already removed from OpenNebula
    # (e.g. destroyed as a side effect of the first, ignored apply above) but the AR
    # resource itself is still tracked in state. Drop just those stale AR entries so the
    # retry below can proceed instead of failing again with "AR not found".
    - name: Dump current terraform state as JSON to detect stale Address Ranges
      ansible.builtin.command:
        cmd: terraform show -json
        chdir: "{{ workspace }}/.terraform/"
      register: tf_state_dump
      changed_when: false

    # Matches both observed OpenNebula provider error phrasings for a stale AR:
    #   "Virtual network (ID:X): AR (ID:Y) not found"
    #   "Virtual network (ID:X): AR (ID:Y): OpenNebula error [INTERNAL]: [one.vn.free_ar] Address Range does not exist"
    - name: Identify OpenNebula Virtual Network IDs reported as having a missing Address Range
      ansible.builtin.set_fact:
        stale_ar_vnet_ids: "{{ (first_apply_result.msg | default('')) | regex_findall('Virtual network \\(ID:(\\d+)\\): AR \\(ID:\\d+\\)') }}"

    # virtual_network_id may be tracked as an int or a string depending on provider
    # version, while stale_ar_vnet_ids (from regex_findall) is always a list of strings;
    # cast explicitly per-item in the `when` below so the comparison isn't silently
    # type-mismatched (a selectattr('..., 'in', ...) pipeline can't cast inline).
    - name: Remove stale Address Range entries from terraform state so the retry can proceed
      ansible.builtin.command:
        cmd: "terraform state rm {{ item.address }}"
        chdir: "{{ workspace }}/.terraform/"
      loop: "{{ (tf_state_dump.stdout | from_json).values.root_module.resources | default([]) }}"
      loop_control:
        label: "{{ item.address }}"
      when: >-
        stale_ar_vnet_ids | length > 0 and
        item.type == 'opennebula_virtual_network_address_range' and
        (item.values.virtual_network_id | string) in stale_ar_vnet_ids
      ignore_errors: true

    - name: Run 'terraform apply' a second time. Command should now succeed
      community.general.terraform:
        project_path: "{{ workspace }}/.terraform/"
        state: "present"

    - name: Remove the Trial Network .ssh/config.d/ file
      ansible.builtin.file:
        path: "/var/lib/jenkins/.ssh/config.d/{{ tn_id }}"
        state: absent

    - name: Get list of TN objects from S3 object storage
      amazon.aws.s3_object:
        endpoint_url: "{{ site_s3_server.endpoint }}"
        mode: list
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        bucket: "{{ site_s3_server.bucket }}"
        prefix: "{{ tn_id }}/"
        validate_certs: false
      register: s3_bucket_items

    - name: Delete TN objects from S3 object storage
      amazon.aws.s3_object:
        endpoint_url: "{{ site_s3_server.endpoint }}"
        mode: delobj
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        bucket: "{{ site_s3_server.bucket }}"
        object: "{{ item }}"
        validate_certs: false
      loop: "{{ s3_bucket_items.s3_keys }}"

    - name: Delete TN directory in S3 object storage
      amazon.aws.s3_object:
        endpoint_url: "{{ site_s3_server.endpoint }}"
        mode: delobj
        access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"
        bucket: "{{ site_s3_server.bucket }}"
        object: "{{ tn_id }}/"
        validate_certs: false
      register: delete_result

    - name: "Debug OK json response"
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.template', '{{ workspace }}/.global/templates/ok_result.json.j2') }}"
      when: debug

    - name: Generate OK json response
      ansible.builtin.template:
        src: "{{ workspace }}/.global/templates/ok_result.json.j2"
        dest: "{{ workspace }}/ok_result-tn_destroy.json"
        mode: "640"
      when: debug

    - name: Send OK json response to TNLCM
      ansible.builtin.uri:
        url: "{{ tnlcm_callback }}"
        method: POST
        body_format: json
        body: "{{ lookup('ansible.builtin.template', '{{ workspace }}/.global/templates/ok_result.json.j2') }}"
        # src: "{{ workspace }}/ok_result-tn_destroy.json"
      register: tnlcm_post
      ignore_errors: true
