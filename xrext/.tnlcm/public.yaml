######################################################
##
## Component public variables
##
## Diverse information read by the TNLCM
## to adapt its behaviour depending on the component.
##
######################################################


####################################
## Component metadata
####################################
metadata:
  maintainers:
    - Joaquín Pérez Otero <joaquin.perez_otero.ext@nokia.com>
  short_description: Appliance that deploys an OpenNebula virtual machine with Python modules installed to consume XR extensions of NaC REST API. 
  long_description: |
    The XRext 6G-Library component allows the experimenters to deploy their own virtual machine for 
    testing XR sessions, using Nokia's Network as Code (NaC) API, on top of the 5G network deployed 
    in the UMA site.

    The virtual machine deployed by the appliance should only interact with the NaC server and the 
    CAPIF server that are already serving the UMA site, through the corresponding Python scripts. 
    The locations and credentials are obtained from the config.ini file, which must be located in 
    the same directory as these scripts. The appliance already provides a config.ini file with the 
    information needed to access the services deployed on the UMA site.
  hypervisors: ["one"]
  depends_on:
    - tn_bastion
  tags:
    - "VM"
    - "appliance"
    - "testing"
  appliances: ["https://marketplace.mobilesandbox.cloud:9443/appliance/service_XRext"]


####################################
## Site-specific variables
####################################
site_variables:
  template_id: ID of the XRext VM template to use in your OpenNebula environment
  image_id: ID of the XRext VM image to use in your OpenNebula environment


####################################
## Input variables
####################################
input:
  one_xrext_networks:
    description: Ordered list of Virtual Network names the VM will be part of. The first Virtual Network is used by Jenkins to reach and configure the VM, so most cases will be fine using always the tn_vxlan
    type: "list[tn_vxlan or vnet]"
    default_value: ["tn_vxlan"]
    required_when: false


####################################
## Generated terraform outputs
####################################
terraform_outputs:
  __entity_name__component_type: "xrext"
  __entity_name__id: "VM ID in OpenNebula. Generated from Terraform Manifest"
  __entity_name__ips: "Dictionary of VM IP addresses: {<VNet ID in OpenNebula>: <IP address>}. Generated from Terraform Manifest"
