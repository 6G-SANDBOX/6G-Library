- name: Increase Helm timeout in install_capif.sh script to 30 minutes
  ansible.builtin.replace:
    path: /root/capif/helm/scripts/install_capif.sh
    regexp: '--wait --timeout=10m'
    replace: '--wait --timeout=30m'
  become: true

- name: Execute Install Monitoring Script
  ansible.builtin.shell: "/root/capif/helm/scripts/install_monitoring.sh"
  become: true
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml