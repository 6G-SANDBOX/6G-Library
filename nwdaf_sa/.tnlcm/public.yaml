######################################################
##
## Component public variables
##
## Diverse information read by the TNLCM
## to adapt its behaviour depending on the component.
##
######################################################


####################################
## Component metadata
####################################
metadata:
  maintainers:
    - Leonidas Lymberopoulos <leon@lamdanetworks.io>

  short_description: Deploys the NWDAF_StreamAnalyzer 6G-SANDBOX extension
  long_description: |
    The **nwdaf_sa** 6G-Library component deploys a NWDAF_StreamAnalyzer extension inside a Kubernetes cluster using the [Helm Chart from oci://registry-1.docker.io/lamdaleon/helm].

  hypervisors: ["one"]


####################################
## Site-specific variables
####################################
site_variables:
  # None

####################################
## Input variables
####################################
input:
  one_nwdaf_sa_target:
    description: Name of a previously deployed `oneKE` component, where the the NWDAF_StreamAnalyzer Helm Chart will be applied. E.g. `oneKE-my_cluster`.
    type: "oneKE"
    required_when: true
  one_nwdaf_sa_REDIS_HOST:
    description: DNS of the Redis service within K8s.
    type: str
    default_value: "redis-service-master"
    required_when: false
  one_nwdaf_sa_REDIS_PORT:
    description: Port of the Redis service.
    type: str
    default_value: "6379"
    required_when: false
  one_nwdaf_sa_CELERY_BROKER_URL:
    description: URL of the Celery Broker.
    type: str
    default_value: "redis://redis-service-master:6379/0"
    required_when: false
  one_nwdaf_sa_CELERY_RESULT_BACKEND:
    description: URL of the Celery Backend.
    type: str
    default_value: "redis://redis-service-master:6379/0"
    required_when: false
  one_nwdaf_sa_LOCALAPI:
    description: Endpoint of the localapi internal service of NWDAF_StreamAnalyzer.
    type: str
    default_value: "001"
    required_when: false
  one_nwdaf_sa_PROMETHEUS_URL:
    description: Endpoint of the Prometheus service for the Openn5GC of the 6G-SANDBOX testbed
    type: str
    default_value: "http://34.38.207.87:9090/api/v1/query"
    required_when: false
  one_nwdaf_sa_NWDAF_LOCALAPI_URL:
    description: Endpoint of the service holding current and predicted values of gathered metrics"
    type: str
    default_value: "http://localhost:3000"
    required_when: false
  one_nwdaf_sa_LOCALAPI_SERVICE_ENDPOINT:
    description: Endpoint of the service that handles the subscriptions to the NWDAF Event Service.
    type: str
    default_value: "http://localapi-service:3000/subscriptions/callback/actual"
    required_when: false
  one_nwdaf_sa_METRICS_AGGREGATOR_SERVICE_ENDPOINT:
    description: Endpoint of the service that collects metrics from Open5GS and Amarisoft radio.
    type: str
    default_value: "http://metrics-aggregator-service:8000/collect"
    required_when: false

####################################
## Generated terraform outputs
####################################
terraform_outputs:
  __entity_name__metadata:
    REDIS_HOST: input.one_nwdaf_sa_REDIS_HOST
    REDIS_PORT: input.one_nwdaf_sa_REDIS_PORT
    CELERY_BROKER_URL: input.one_nwdaf_sa_CELERY_BROKER_URL
    CELERY_RESULT_BACKEND: input.one_nwdaf_sa_CELERY_RESULT_BACKEND
    LOCALAPI: input.one_nwdaf_sa_LOCALAPI
    PROMETHEUS_URL: input.one_nwdaf_sa_PROMETHEUS_URL
    NWDAF_LOCALAPI_URL: input.one_nwdaf_sa_NWDAF_LOCALAPI_URL
    LOCALAPI_SERVICE_ENDPOINT: input.one_nwdaf_sa_LOCALAPI_SERVICE_ENDPOINT
    METRICS_AGGREGATOR_SERVICE_ENDPOINT: input.one_nwdaf_sa_METRICS_AGGREGATOR_SERVICE_ENDPOINT
    oneke: input.one_nwdaf_sa_target
