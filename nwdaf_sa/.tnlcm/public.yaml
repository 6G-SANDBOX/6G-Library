######################################################
##
## Component public variables
##
## Diverse information read by the TNLCM
## to adapt its behaviour depending on the component.
##
######################################################


####################################
## Component metadata
####################################
metadata:
  maintainers:
    - Leonidas Lymberopoulos <leon@lamdanetworks.io>

  short_description: Deploys the NWDAF_StreamAnalyzer 6G-SANDBOX extension
  long_description: |
    The **nwdaf_sa** 6G-Library component deploys a NWDAF_StreamAnalyzer extension inside a Kubernetes cluster using the [latest version of Helm Chart from oci://registry-1.docker.io/lamdaleon/helm].

  hypervisors: ["one"]


####################################
## Site-specific variables
####################################
site_variables:
  # None

####################################
## Input variables
####################################
input:
  one_nwdaf_sa_target:
    description: Name of a previously deployed `oneKE` component, where the the NWDAF_StreamAnalyzer Helm Chart will be applied. E.g. `oneKE-my_cluster`.
    type: "oneKE"
    required_when: true
  one_nwdaf_sa_prometheus_url:
    description: URL of Prometheus query API with Prometheus being the Open5GS Prometheus service
    type: str
    default_value: "http://10.220.2.104:9090/api/v1/query"
    required_when: false
  one_nwdaf_sa_prometheus_query_instance:
    description: "IP and Port of Prometheus query instance".
    type: str
    default_value: "smf.open5gs.org:9090"
    required_when: false
  one_nwdaf_sa_prometheus_query_job:
    description: "Prometheus query body"
    type: str
    default_value: "redis://redis-service-master:6379/0"
    required_when: false
  one_nwdaf_sa_amarisoft_url:
    description: "Amarisoft Web Socket URL"
    type: str
    default_value: "ws://10.220.2.10:9000"
    required_when: false

prometheus_url:
prometheus_query_instance: "smf.open5gs.org:9090"
prometheus_query_job: "open5gs-smfd"
amarisoft_url:

####################################
## Generated terraform outputs
####################################
terraform_outputs:
  __entity_name__metadata:
    prometheus_url: input.one_nwdaf_sa_prometheus_url
    prometheus_query_instance: input.one_nwdaf_sa_prometheus_query_instance
    prometheus_query_job: input.one_nwdaf_sa_prometheus_query_job
    amarisoft_url: input.one_nwdaf_sa_amarisoft_url
    oneke: input.one_nwdaf_sa_target
