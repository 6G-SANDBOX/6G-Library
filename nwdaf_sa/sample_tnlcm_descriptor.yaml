trial_network:
  tn_init:
    type: "tn_init"
    dependencies: []
    input:
      one_vxlan_mtu: 1450
      one_vxlan_guest_mtu: 1400
  vnet-internal:
    type: "vnet"
    name: "internal"
    dependencies:
      - "tn_init"
    input:
      one_vnet_first_ip: "10.10.10.1"
      one_vnet_netmask: 24
      one_vnet_address_size: 100
      one_vnet_gw: "10.10.10.1"
      one_vnet_dns: "1.1.1.1"
      one_vnet_mtu: 1450
      one_vnet_guest_mtu: 1400
  oneKE-cluster:
    type: "oneKE"
    name: "cluster"
    dependencies:
      - "tn_init"
      - "vnet-internal"
    input:
      one_oneKE_external_vnet: "tn_vxlan"
      one_oneKE_internal_vnet: "vnet-internal"
      one_oneKE_version: "131"
      # one_oneKE_multus: true             # Default value
      # one_oneKE_cni_plugin: "canal"      # Default value
      # one_oneKE_metallb: true            # Default value
      one_oneKE_metallb_range: "10.21.12.200-10.21.12.240"
      # one_oneKE_longhorn: true           # Default value
      # one_oneKE_traefik: false           # Default value
      # one_oneKE_nginx_passthough: false  # Default value
  nwdaf_sa-core:
    type: "nwdaf_sa"
    name: "core"
    dependencies:
      - "oneKE-cluster"
    input:
      one_nwdaf_sa_target: "oneKE-cluster"
      one_nwdaf_sa_prometheus_url: "http://10.220.2.104:9090/api/v1/query"
      one_nwdaf_sa_prometheus_query_instance: "smf.open5gs.org:9090"
      one_nwdaf_sa_prometheus_query_job: "open5gs-smfd"
      one_nwdaf_sa_amarisoft_url: "ws://10.220.2.10:9000"
