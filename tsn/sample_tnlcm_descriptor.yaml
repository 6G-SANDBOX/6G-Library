title: "Sample TNLCM descriptor for TSN"
description: "Simple descriptor for connect to TSN"
trial_network:
  tn_vxlan:
    type: "tn_vxlan"
    dependencies: []
    input:
      one_vxlan_netmask: 24
      one_vxlan_first_ip: "192.168.214.1"
      one_vxlan_address_size: 254
  tn_bastion:
    type: "tn_bastion"
    dependencies:
      - "tn_vxlan"
    input:
      one_bastion_vpn_clients: 3
      one_bastion_vpn_allowedips: "0.0.0.0/0"
  tsn:
    type: "tsn"
    dependencies:
      - "tn_vxlan"
      - "tn_bastion"
    input: {}
