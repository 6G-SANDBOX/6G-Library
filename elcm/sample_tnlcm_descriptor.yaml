title: "Sample TNLCM descriptor for ELCM"
description: "ELCM with InfluxDB and Grafana to store and visualize data obtained from an experiment"
trial_network:
  tn_vxlan:
    type: "tn_vxlan"
    dependencies: []
    input: {}
  tn_bastion:
    type: "tn_bastion"
    dependencies:
      - "tn_vxlan"
    input: {}
  influxdb-v2:
    type: "influxdb"
    name: "v2"
    dependencies:
      - "tn_vxlan"
      - "tn_bastion"
    input:
      one_influxdb_version: "2.7.11"
      one_influxdb_user: "admin"
      one_influxdb_password: "adminadmin"
      one_influxdb_org: "testing"
      one_influxdb_bucket: "testing"
      one_influxdb_token: "default-token-testing"
  grafana-v11:
    type: "grafana"
    name: "v11"
    dependencies:
      - "tn_vxlan"
      - "tn_bastion"
    input:
      one_grafana_version: "11.6.0"
      one_grafana_password: "adminadmin"
  elcm-exp:
    type: "elcm"
    name: "exp"
    dependencies:
      - "tn_vxlan"
      - "tn_bastion"
      - "influxdb-v2"
      - "grafana-v11"
    input:
      one_elcm_influxdb: "influxdb-v2"
      one_elcm_grafana: "grafana-v11"
