######################################################
##
## Component public variables
##
## Diverse information read by the TNLCM
## to adapt its behaviour depending on the component.
##
######################################################


####################################
## Component metadata
####################################
metadata:
  maintainers:
    - Almudena Díaz Zayas <adz@uma.es>
    - Carlos Andreo López <c.andreo@uma.es>
  short_description: Deploy a virtual machine with the ELCM backend and frontend.
  long_description: |
    Ubuntu 22.04 LTS virtual machine with ELCM installed.
    
    ELCM (Experiment Lifecycle Management) is a system designed to manage the complete lifecycle of experiments in research and development environments. It provides a REST API backend built with Python and a web-based frontend also developed in Python.

    The experiments executed through ELCM allow storing collected metrics in an InfluxDB database, enabling efficient data storage and retrieval for further analysis.

    This virtual machine also linked with OpenTAP, InfluxDB and Grafana services, facilitating experiment automation, data collection and real-time visualization.
  hypervisors: ["one"]
  appliances: ["https://marketplace.mobilesandbox.cloud:9443/appliance/service_ELCM"]


####################################
## Site-specific variables
####################################
site_variables:
  template_id: ID of the ELCM VM template to use in your OpenNebula environment
  image_id: ID of the ELCM VM image to use in your OpenNebula environment


####################################
## Input variables
####################################
input:
  one_elcm_portal_enable:
    description: Enable the ELCM portal
    type: bool
    default_value: true
    required_when: true
  one_elcm_influxdb:
    description: Name of the InfluxDB component used to store the metrics
    type: influxdb or monitoring
    required_when: true
  one_elcm_grafana:
    description: Name of the Grafana component used to visualize the metrics
    type: grafana or monitoring
    required_when: true


####################################
## Generated terraform outputs
####################################
terraform_outputs:
  __entity_name__id: "VM ID in OpenNebula. Generated from Terraform Manifest"
  __entity_name__ips: "Dictionary of VM IP addresses: {<VNet ID in OpenNebula>: <IP address>}. Generated from Terraform Manifest"
