######################################################
##
## Component public variables
##
## Diverse information read by the TNLCM
## to adapt its behaviour depending on the component.
##
######################################################


####################################
## Component metadata
####################################
metadata:
  maintainers:
    - Jesus Macias Portela <jesus.maciasportela@telefonica.com>
    - Ana Isabel Lara García <anaisabel.laragarcia@telefonica.com>
    - Álvaro Curto Merino <alvaro.curtomerino@telefonica.com>
  short_description: Enables routing temporarily between Nokia Airscale and a previously deployed 5G Core.
  long_description: |
    Component to integrate the Nokia Airscale physical equipment with a 5G core already deployed inside the Trial Network.
    It is done by enabling the necessary routing path for a limited time duration using a [6G-Sandbox route-manager-api](https://marketplace.mobilesandbox.cloud:9443/appliance/service_routemanager) VM expected to be already deployed in the site.
    WARNING: This component may only work if the configurations for the related 5G Core and UE are set as follows:
    - `mcc`: "214" 
    - `mnc`: "702"
    - `apn`: "internet"
    - `tac`: 1
    - `s_nssai_sst`: 1
    - `s_nssai_sd`: "000009"
    - `amf_n2_ip`: "10.10.12.200"
    - `upf_n3_ip`: "10.10.12.201"
    NOTE: Aditional routing configuration that is not dependent on the Trial Network may also need to be done beforehand.
    NOTE: Currently this component is only available in the site "uma".
  hypervisors: ["any"]
  destroy_script: true
  resource_manager: true


####################################
## Site-specific variables
####################################
site_variables:
  n2_ip: "IP address of Nokia Airscale in the Control Plane N2 interface. It will try to connect to the AMF of the 5G Core specified in `any_nokia_radio_linked_5gcore`."
  n3_ip: "IP address of Nokia Airscale in the User Plane N3 interface. It will try to connect to the UPF of the 5G Core specified in `any_nokia_radio_linked_5gcore`."


####################################
## Input variables
####################################
input:
  any_nokia_radio_linked_5gcore:
    description: Name of a previously deployed 5G Core component inside the same Trial Network. The gNB will try to connect to its AMF.
    type: "open5gs_vm or open5gs_k8s or open5gcore_vm or upf_p4_sw"
    required_when: true
  any_nokia_radio_start_time:
    description: |
      Time and date from which the route is enabled, with RFC 3339 section 5.6 format. E.g. '2024-11-08T09:12:00+00:00'.
      If unspecified, value takes current time and date.
    type: str
    default_value: Current time and date
    required_when: false
  any_nokia_radio_duration:
    description: Time in seconds for the Nokia Airsale reservation
    type: int
    default_value: 3600
    required_when: false


####################################
## Generated terraform outputs
####################################
terraform_outputs:
  __entity_name__component_type: "nokia_radio"
  __entity_name__gnb_metadata:
    linked_5gcore: input.any_nokia_radio_linked_5gcore
