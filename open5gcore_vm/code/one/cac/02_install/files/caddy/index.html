<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open5GCore</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      header {
        background-color: #0073e6;
        color: #fff;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: 0.2px;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      /* Dark Mode Toggle Button Styles */
      #darkModeToggle {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        cursor: pointer;
        padding: 0;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff; /* Sets the SVG color to white */
        transition:
          background 0.3s,
          border-color 0.3s,
          transform 0.2s;
      }

      #darkModeToggle:hover {
        background-color: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.6);
      }

      #darkModeToggle svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor; /* Inherits white from parent */
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .toggle-label {
        font-size: 0.95rem;
        opacity: 0.95;
        user-select: none;
      }

      /* Slider switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 46px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #cbd5e1;
        transition: background-color 0.2s ease;
        border-radius: 9999px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 20px;
        width: 20px;
        left: 2px;
        top: 2px;
        background-color: #fff;
        transition: transform 0.2s ease;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .switch input:checked + .slider {
        background-color: #22c55e;
      }
      .switch input:checked + .slider:before {
        transform: translateX(22px);
      }

      main {
        padding: 20px;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      ul li {
        background: #fff;
        margin: 10px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      ul li a {
        text-decoration: none;
        color: #0073e6;
        font-weight: bold;
      }
      ul li a:hover {
        text-decoration: underline;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9ca3af;
        display: inline-block;
        vertical-align: middle;
        margin-right: 6px;
      }

      /* Dark mode */
      body.dark-mode {
        background-color: #121212;
        color: #e0e0e0;
      }
      .dark-mode header {
        background-color: #1f1f1f;
      }
      .dark-mode form,
      .dark-mode table {
        background-color: #1e1e1e;
        border-color: #333;
      }
      .dark-mode th {
        background-color: #2c2c2c;
        border-color: #333;
      }
      .dark-mode li {
        background-color: #1e1e1e;
        border-color: #333;
      }
      .dark-mode td {
        border-color: #333;
      }
      .dark-mode tr:nth-child(even) {
        background-color: #292929;
      }
      .dark-mode tr:hover {
        background-color: #3a3a3a;
      }
      .dark-mode input,
      .dark-mode select {
        background-color: #2c2c2c;
        color: #fff;
        border-color: #444;
      }
      .dark-mode input::placeholder {
        color: #666;
      }
      .dark-mode .char-count {
        color: #888;
      }
      .dark-mode select option {
        background-color: #2c2c2c;
        color: #fff;
      }
      .dark-mode .slider {
        background-color: #4b5563;
      }
      .dark-mode .toggle-label {
        color: #e5e7eb;
      }
      .dark-mode ul li a {
        color: #60a5fa;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Open5GCore</h1>
      <div class="header-controls" aria-label="Controls">
        <span class="toggle-label">Auto-check</span>
        <label class="switch" aria-label="Toggle auto-check availability">
          <input type="checkbox" id="availabilityToggle" />
          <span class="slider"></span>
        </label>
        <button
          id="darkModeToggle"
          aria-label="Toggle Dark Mode"
          title="Toggle Dark Mode"
        ></button>
      </div>
    </header>

    <main>
      <h2>NF Consoles</h2>
      <ul class="consoles">
        <li><a href="/amf/console.html">AMF</a></li>
        <li><a href="/nrf/console.html">NRF</a></li>
        <li><a href="/upf1/console.html">UPF1</a></li>
        <li><a href="/udm/console.html">UDM</a></li>
        <li><a href="/pcf/console.html">PCF</a></li>
        <li><a href="/ausf/console.html">AUSF</a></li>
        <li><a href="/smf/console.html">SMF</a></li>
      </ul>
      <h2>Component UI</h2>
      <ul class="ui">
        <li><a href="/udm/udm.html">UDM UI</a></li>
        <!-- <li><a href="/ue1/ue.html">UE UI</a></li> -->
      </ul>
    </main>

    <script>
      const INTERVAL_MS = 5000;
      let intervalId = null;
      let items = [];
      let checkEnabled = localStorage.getItem("checkEnabled") !== "false";

      // SVG Icons (Monochrome)
      const moonIcon = `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
      const sunIcon = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;

      function ensureDot(li) {
        let dot = li.querySelector(".status-dot");
        if (!dot) {
          dot = document.createElement("span");
          dot.className = "status-dot";
          dot.title = "Checking...";
          li.insertBefore(dot, li.firstChild);
        }
        return dot;
      }

      async function checkReachability(url, dot, method) {
        try {
          const res = await fetch(url, { method, cache: "no-store" });
          setStatus(dot, res.ok);
        } catch {
          setStatus(dot, false);
        }
      }

      function setStatus(dot, ok) {
        if (ok) {
          dot.style.backgroundColor = "#16a34a";
          dot.title = "Reachable";
        } else {
          dot.style.backgroundColor = "#dc2626";
          dot.title = "Unreachable";
        }
      }

      function setDisabled(dot) {
        dot.style.backgroundColor = "#9ca3af";
        dot.title = "Disabled";
      }

      function checkAll() {
        items.forEach(({ a, dot }) => {
          const href = a.getAttribute("href").replace("console.html", "live");
          checkReachability(href, dot, "HEAD");
        });
      }

      function startChecks() {
        if (intervalId) clearInterval(intervalId);
        checkAll();
        intervalId = setInterval(checkAll, INTERVAL_MS);
      }

      function stopChecks() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
        items.forEach(({ dot }) => setDisabled(dot));
      }

      document.addEventListener("DOMContentLoaded", () => {
        // --- Reachability Logic ---
        const links = Array.from(
          document.querySelectorAll("main ul.consoles a"),
        );
        items = links.map((a) => ({
          a,
          dot: ensureDot(a.closest("li")),
        }));

        const toggle = document.getElementById("availabilityToggle");
        if (toggle) {
          toggle.checked = checkEnabled;
          toggle.addEventListener("change", (e) => {
            checkEnabled = e.target.checked;
            localStorage.setItem("checkEnabled", String(checkEnabled));
            if (checkEnabled) startChecks();
            else stopChecks();
          });
        }

        if (checkEnabled) startChecks();
        else stopChecks();

        // --- Dark Mode Logic ---
        const modeBtn = document.getElementById("darkModeToggle");
        const body = document.body;

        function updateIcon() {
          const isDark = body.classList.contains("dark-mode");
          // If dark, show Sun (option to switch to Light). If light, show Moon.
          modeBtn.innerHTML = isDark ? sunIcon : moonIcon;
        }

        function applyThemeFromStorage() {
          const enabled = localStorage.getItem("darkMode") === "enabled";
          if (enabled) {
            body.classList.add("dark-mode");
          } else {
            body.classList.remove("dark-mode");
          }
          updateIcon();
        }

        // Initial check on load
        applyThemeFromStorage();

        // Listen for Back/Forward navigation
        window.addEventListener("pageshow", (event) => {
          // Re-check storage whenever the page is shown, even from cache
          applyThemeFromStorage();
        });

        modeBtn.addEventListener("click", () => {
          body.classList.toggle("dark-mode");
          const enabled = body.classList.contains("dark-mode");
          localStorage.setItem("darkMode", enabled ? "enabled" : "disabled");
          updateIcon();
        });
      });
    </script>
  </body>
</html>
