trial_network:
  tn_init:
    type: "tn_init"
    dependencies: []
    input:
      one_vxlan_netmask: 24
      one_vxlan_first_ip: "192.168.214.1"
      one_vxlan_address_size: 254
      one_bastion_vpn_clients: 3
      one_bastion_vpn_allowedips: "0.0.0.0/0"
  ris-ray:
    type: "ris"
    name: "ray"
    dependencies: ["tn_init"]
    input:
      any_ris_f0: "28.9"             # Default value is 28.0
      any_ris_dist: "2.2"            # Default value is 10.0
      any_ris_phi_t: "12"            # Default value is 0.0
      any_ris_theta_t: "11"          # Default value is 0.0
      # any_ris_num_phi_r: 1         # Default value
      # any_ris_phi_r_low: "0.0"     # Default value
      any_ris_phi_r_high: "0.0"      # Default value is 360.0
      any_ris_num_theta_r: 10        # Default value is 1
      any_ris_theta_r_low: "20.0"    # Default value is 0.0
      any_ris_theta_r_high: "75.0"   # Default value is 90.0
